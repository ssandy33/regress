services:
  caddy:
    image: caddy:2-alpine
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - ./deploy/caddy-entrypoint.sh:/entrypoint.sh
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-}
    entrypoint: /entrypoint.sh
    # Joins the shared external caddy_net so this prod Caddy can reverse-proxy
    # the QA stack (qa-backend / qa-frontend aliases) for the qa.{$DOMAIN} site
    # block. See docker-compose.qa.yml and deploy/qa/README.md (issue #330).
    networks:
      - default
      - caddy_net
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./deploy/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.5.2
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://${DOMAIN}/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_LOG_LEVEL=warn
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    # Image-pinned deploy (#341 / SUB-2, ADR #338): pull the exact CI-built
    # artifact from GHCR by @sha256: digest instead of rebuilding on the box.
    # BACKEND_IMAGE_DIGEST is exported by .github/workflows/_deploy-ssh.yml from
    # the build-and-push-images job's backend-digest output before `compose pull`.
    image: ghcr.io/ssandy33/regress-backend@${BACKEND_IMAGE_DIGEST}
    # No ports exposed — only accessible via Caddy through Docker network
    # Run as the non-root appuser (UID/GID 1000) created in backend/Dockerfile.
    # See SECURITY.md section 2.
    user: "1000:1000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # APP_ENV=production hard-blocks the `seed-qa` CLI (issue #349): synthetic
      # test data can never be written to the prod database. PRICING_MODE is
      # intentionally NOT set here, so it defaults to "live" — the QA stub
      # pricing path is unreachable on prod by configuration.
      - APP_ENV=production
      - FRED_API_KEY=${FRED_API_KEY}
      - DATABASE_URL=sqlite:///./data/regression_tool.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - ALLOWED_USERS=${ALLOWED_USERS:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SCHWAB_ENCRYPTION_KEY=${SCHWAB_ENCRYPTION_KEY:-}
      - AXIOM_API_TOKEN=${AXIOM_API_TOKEN:-}
      - AXIOM_DATASET=${AXIOM_DATASET:-regression-tool}
    volumes:
      - sqlite_data:/app/data
    # NOT on caddy_net (issue #334): only the prod Caddy joins the shared
    # network — it reaches this service over the project-default network.
    # Keeping prod services off caddy_net stops their implicit service-name
    # DNS aliases from colliding with the QA stack's on the shared network.
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "3"
        loki-batch-size: "400"
        loki-external-labels: "job=regression-tool,service=backend"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    # Image-pinned deploy (#341 / SUB-2, ADR #338): pull by @sha256: digest.
    # FRONTEND_IMAGE_DIGEST is exported by _deploy-ssh.yml from the
    # build-and-push-images job's frontend-digest output before `compose pull`.
    image: ghcr.io/ssandy33/regress-frontend@${FRONTEND_IMAGE_DIGEST}
    # No ports exposed to host — only accessible via Caddy through Docker network
    # Run as the non-root node user (UID/GID 1000) from the Node base image.
    # See SECURITY.md section 2.
    user: "1000:1000"
    environment:
      - HOSTNAME=0.0.0.0
      - INTERNAL_API_ORIGIN=http://backend:8000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - GITHUB_ID=${GITHUB_ID:-}
      - GITHUB_SECRET=${GITHUB_SECRET:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-}
      - ALLOWED_USERS=${ALLOWED_USERS:-}
    # NOT on caddy_net — see the backend service note (issue #334).
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "3"
        loki-batch-size: "400"
        loki-external-labels: "job=regression-tool,service=frontend"
    # Probe /auth/signin directly (issue #232). The old probe hit `/`, which
    # returns a 307 redirect (< 400) the instant Next.js is *listening* — so a
    # fully-broken app reported healthy (the v1.0.0 #229 outage). /auth/signin
    # is a real rendered page, is middleware-excluded so it never redirects,
    # and renders in both auth-on and auth-off deployments; a 200 proves the
    # render pipeline produced HTML, not just a redirect header. This is a
    # container-layer AC validated via the QA-stack healthy/unhealthy/auth-
    # redirect cycle (not the pytest/Playwright pyramid); see PR #232 body.
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://127.0.0.1:8080/auth/signin', (r) => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  # Implicit project network, kept for intra-prod service DNS
  # (caddy -> backend/frontend, grafana -> loki, etc.).
  default:
  # Shared cross-stack network the QA stack (docker-compose.qa.yml) also joins,
  # so this prod Caddy can resolve qa-backend / qa-frontend. Declared external:
  # neither stack auto-creates it. Create once on the box with
  # `docker network create caddy_net` (deploy/qa-deploy.sh and deploy/update.sh
  # both create it defensively). See deploy/qa/README.md (issue #330).
  caddy_net:
    external: true

volumes:
  sqlite_data:
  caddy_data:
  caddy_config:
  loki_data:
  grafana_data:
