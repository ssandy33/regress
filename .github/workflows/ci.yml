name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  # Quality v1 — Wave 1 (#267): backend test pyramid split into independent jobs.
  # Each backend job runs ONE marker tier (unit OR integration) and emits its
  # own coverage XML. Coverage will be reunified in Wave 3 (#270); here it's
  # left split per job so a flaky integration run doesn't hide a unit regression.
  backend-unit:
    name: Backend tests (unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          # Need PR base SHA available locally for the tdd_red diff scan below
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short -m unit --cov=app --cov-report=term-missing --cov-report=xml:coverage-unit.xml

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: backend/coverage-unit.xml
          if-no-files-found: ignore

      # Contract v1 — Wave 1 (#303): fail PRs that change API surface
      # without committing a regenerated openapi.json snapshot. The
      # regen script (#302) is deterministic; the comparison is exact.
      - name: OpenAPI drift check
        id: openapi_drift_check
        run: |
          python -m openapi.regen --check || {
            echo ""
            echo "::error::OpenAPI snapshot is stale. Run 'python -m openapi.regen' and commit backend/openapi/openapi.json."
            exit 1
          }

      # Quality v1 — Wave 2 (#269): block PR merges that leave a tdd_red
      # marker behind. Diff-based grep over .py files added/modified on
      # this PR relative to its base SHA. Skipped on push-to-main runs
      # (no pull_request context exists).
      - name: tdd_red gate (PR diff scan)
        id: tdd_red_gate
        if: github.event_name == 'pull_request'
        run: python -m scripts.check_tdd_red --diff-base ${{ github.event.pull_request.base.sha }}

  backend-integration:
    name: Backend tests (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        run: pytest tests/ -v --tb=short -m integration --cov=app --cov-report=term-missing --cov-report=xml:coverage-integration.xml

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: backend/coverage-integration.xml
          if-no-files-found: ignore

  # Issue #330: validate the QA compose file structurally. `docker compose
  # config -q` parses + schema-validates docker-compose.qa.yml, so a malformed
  # QA compose fails CI here (the dynamic mirror of the static assertions in
  # backend/tests/test_qa_compose_config.py). The DOMAIN env is set so the
  # ${DOMAIN} interpolation in NEXTAUTH_URL resolves during validation.
  qa-compose-validate:
    name: QA compose validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate QA compose file
        env:
          DOMAIN: regression.example.com
        run: docker compose -f docker-compose.qa.yml config -q

  # Image-pinned promotion (#324 / SUB-1, ADR #338): build both images once
  # in CI and push them to GHCR tagged by commit SHA (and the release tag on a
  # release). Downstream sub-issues pull a registry-pinned digest instead of
  # rebuilding on the VPS. Additive — nothing in the deploy path consumes these
  # outputs yet (SUB-2 wires deploy.yml).
  #
  # PRs build but DO NOT push (push is gated on event_name != 'pull_request')
  # so fork PRs can't push to the repo's GHCR namespace. Push uses the built-in
  # GITHUB_TOKEN with packages: write — no separate PAT is needed for pushing
  # to the repo's own namespace (the box's pull-side PAT is a SUB-2 concern).
  build-and-push-images:
    name: Build + push images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend-digest: ${{ steps.build-backend.outputs.digest }}
      frontend-digest: ${{ steps.build-frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Env-agnostic invariant guard (ADR #338): the frontend image must be
      # build-time environment-agnostic — no NEXT_PUBLIC_* value may differ
      # QA↔prod, or digest-promotion is void for the frontend. The only allowed
      # build-baked var is NEXT_PUBLIC_API_URL (resolves to '' → relative URLs
      # at build; see frontend/api/client.js). Fail CI if any OTHER NEXT_PUBLIC_*
      # appears in the frontend source.
      - name: Guard — no new env-baked NEXT_PUBLIC_* in frontend
        run: |
          offenders=$(grep -rhoE 'NEXT_PUBLIC_[A-Z0-9_]+' frontend \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
            --exclude-dir=node_modules --exclude-dir=.next \
            | sort -u | grep -vx 'NEXT_PUBLIC_API_URL' || true)
          if [ -n "$offenders" ]; then
            echo "::error::New build-baked NEXT_PUBLIC_* var(s) break the env-agnostic frontend image (ADR #338):"
            echo "$offenders"
            exit 1
          fi
          echo "OK — only NEXT_PUBLIC_API_URL is build-baked (resolves to relative URL)."

      - name: Compute backend image tags
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ssandy33/regress-backend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
          # ADR #338: :latest is never a deploy coordinate.
          flavor: |
            latest=false

      - name: Compute frontend image tags
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ssandy33/regress-frontend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
          # ADR #338: :latest is never a deploy coordinate.
          flavor: |
            latest=false

      - name: Build + push backend image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push frontend image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-checks:
    name: Frontend checks (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Contract v1 — Wave 3 (#306): fail PRs that change the OpenAPI
      # snapshot without regenerating frontend/api/generated/types.ts.
      # Mirrors the backend OpenAPI drift check in backend-unit (Wave 1 #303).
      - name: Frontend types drift check
        id: frontend_types_drift_check
        run: |
          npm run types:check || {
            echo ""
            echo "::error::frontend/api/generated/types.ts is stale. Run 'npm run types:regen' (cd frontend) and commit the result."
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Quality v1 — Wave 1 (#267): Playwright job closes the E2E gap from #231.
  # Shakedown period until 2026-05-25. After 48h of green runs, flip
  # continue-on-error: false. Owner: orchestrator + manual flip.
  frontend-playwright:
    name: Frontend Playwright (shakedown)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Quality v1 — Wave 2 (#270): enforce @smoke / @e2e tagging convention.
      # Fails the job if any frontend/e2e/*.spec.js (non-prod) has an untagged
      # test() or test.describe() call at column 0. See CLAUDE.md "Testing
      # Requirements → Playwright tagging — @smoke / @e2e (R6)".
      - name: Playwright tag check
        id: playwright_tag_check
        run: bash scripts/check-playwright-tags.sh

      # Quality v1 — Wave 2 (#270): smoke-then-e2e split. @smoke is the
      # critical-path subset (dashboard, auth, schwab, trading-rules); failing
      # smoke short-circuits the broader e2e run. Both steps inherit the
      # job-level continue-on-error: true until the 2026-05-25 shakedown flip.
      - name: Run Playwright smoke
        run: npx playwright test --grep "@smoke"

      - name: Run Playwright e2e
        run: npx playwright test --grep "@e2e"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
