name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  # Quality v1 — Wave 1 (#267): backend test pyramid split into independent jobs.
  # Each backend job runs ONE marker tier (unit OR integration) and emits its
  # own coverage XML. Coverage will be reunified in Wave 3 (#270); here it's
  # left split per job so a flaky integration run doesn't hide a unit regression.
  backend-unit:
    name: Backend tests (unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short -m unit --cov=app --cov-report=term-missing --cov-report=xml:coverage-unit.xml

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: backend/coverage-unit.xml
          if-no-files-found: ignore

      # Quality v1 — Wave 2 (#269): block PR merges that leave a tdd_red
      # marker behind. Diff-based grep over .py files added/modified on
      # this PR relative to its base SHA. Skipped on push-to-main runs
      # (no pull_request context exists).
      - name: tdd_red gate (PR diff scan)
        id: tdd_red_gate
        if: github.event_name == 'pull_request'
        run: python -m scripts.check_tdd_red --diff-base ${{ github.event.pull_request.base.sha }}

  backend-integration:
    name: Backend tests (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        run: pytest tests/ -v --tb=short -m integration --cov=app --cov-report=term-missing --cov-report=xml:coverage-integration.xml

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: backend/coverage-integration.xml
          if-no-files-found: ignore

  frontend-checks:
    name: Frontend checks (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Quality v1 — Wave 1 (#267): Playwright job closes the E2E gap from #231.
  # Shakedown period until 2026-05-25. After 48h of green runs, flip
  # continue-on-error: false. Owner: orchestrator + manual flip.
  frontend-playwright:
    name: Frontend Playwright (shakedown)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
